[project]
name = "so101-calib"
version = "0.1.0"
description = "SO-101 calibration: servo system identification, camera intrinsics, hand-eye calibration and an error budget"
readme = "README.md"
license = "MIT"
authors = [{ name = "Junhan Hu" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pin>=3.0",              # Pinocchio
    "opencv-python>=4.8,<5",  # ChArUco, calibration, windows; same major as LeRobot's headless build (shared files)
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "so101-core @ git+https://github.com/hujunhan/so101-core@534b1e91f488768ea92d1f92bbf6cc3459d00bb7",
    "so101-kinematics @ git+https://github.com/hujunhan/so101-kinematics@f2f9de8530313b6c97eb0948e3e1537e47b145c8",
]

[project.scripts]
so101-servo = "so101_calib.servo_cli:main"
so101-statics = "so101_calib.statics_cli:main"
so101-track = "so101_calib.track_cli:main"
so101-touch = "so101_calib.touch_cli:main"
so101-cam = "so101_calib.cam_cli:main"
so101-handeye = "so101_calib.handeye_cli:main"
so101-zero = "so101_calib.zero_cli:main"
so101-budget = "so101_calib.budget_cli:main"
so101-park = "so101_calib.park_cli:main"

[project.optional-dependencies]
hw = ["so101-core[hw] @ git+https://github.com/hujunhan/so101-core@534b1e91f488768ea92d1f92bbf6cc3459d00bb7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_calib"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
