<style>
  /* One deliberate look: the board on white glass in both themes. A small bar holds the scale check. */
  :root {
    --paper: #ffffff;

    --mark: #c2410c;
    --bar: #eef1f4;

    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 13px/1.4 var(--mono); overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .bar { position: fixed; top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px);
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 10px;
    background: var(--bar); border-bottom-right-radius: 6px; color: var(--ink-soft);
    max-width: calc(100% - 20px); }
  .bar button { font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--ink-soft); border-radius: 3px; padding: 2px 8px; cursor: pointer; }
  .bar button:focus-visible { outline: 2px solid var(--mark); outline-offset: 1px; }
  .warn { color: var(--mark); font-weight: 600; }
</style>

  const canvas = document.getElementById("board");
  const info = document.getElementById("info");
  const warn = document.getElementById("warn");

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--paper");
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const x = Math.round((canvas.width - BOARD_PX[0]) / 2), y = Math.round((canvas.height - BOARD_PX[1]) / 2);
    if (img.complete) ctx.drawImage(img, x, y);
    info.textContent = `pixel ratio ${dpr}`;
    const problems = [];
    if (canvas.width < BOARD_PX[0] || canvas.height < BOARD_PX[1])
      problems.push("board does not fit: go full screen");
    if (window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.01)
      problems.push("page is zoomed: reset to 100%");
    warn.textContent = problems.join(" · ");
    warn.hidden = problems.length === 0;
  }
  document.getElementById("fs").addEventListener("click", () => {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) Promise.resolve(req.call(el)).catch(() => {});
  });
  img.onload = draw;
  window.addEventListener("resize", draw);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", draw);
  draw();
</script>
